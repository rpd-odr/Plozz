name: Sync upstream and build iOS IPA

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: plozz-upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/brandomoore/Plozz.git
          git fetch upstream main --no-tags

          if git diff --quiet HEAD upstream/main; then
            echo 'No upstream changes.'
            exit 0
          fi

          git merge --no-edit -X ours upstream/main
          git push origin main

      - name: Resolve upstream release
        id: version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          data = json.load(open("App/Resources/ReleaseNotes.json"))
          r = data["releases"][0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"release_version={r['version']}\n")
              f.write(f"marketing_version={r.get('marketingVersion', r['version'])}\n")
              f.write(f"build={r['build']}\n")
          print(f"Upstream release: {r['version']} / Apple {r.get('marketingVersion', r['version'])} / build {r['build']}")

      - name: Build release if missing
        env:
          TAG: v${{ steps.version.outputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "$REMOTE_TAG_SHA" != "$HEAD_SHA" ]; then
            echo "Updating fork tag $TAG to $HEAD_SHA"
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
            git tag -d "$TAG" 2>/dev/null || true
            git tag "$TAG" HEAD
            git push origin "$TAG"
          else
            echo "Fork tag $TAG already points to HEAD."
          fi

          gh workflow run ios-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
