name: Sync upstream and build iOS IPA
# Force rebuild against current upstream HEAD

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: plozz-upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/brandomoore/Plozz.git
          git fetch origin main --no-tags
          git reset --hard origin/main
          git fetch upstream main --no-tags
          if git diff --quiet HEAD upstream/main; then
            echo 'No upstream changes.'
          else
            git merge --no-edit -X ours upstream/main
            git push origin main
          fi
      - name: Resolve upstream release
        id: version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          data=json.load(open("App/Resources/ReleaseNotes.json"))
          r=data["releases"][0]
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"release_version={r['version']}\n")
              f.write(f"marketing_version={r.get('marketingVersion',r['version'])}\n")
              f.write(f"build={r['build']}\n")
          PY
      - name: Build release if missing
        env:
          TAG: v${{ steps.version.outputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FORCE_REBUILD=false
          if git log -1 --pretty=%B | grep -q '\[force-rebuild\]'; then
            FORCE_REBUILD=true
          fi
          RELEASE_EXISTS=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          IPA_NAME="Plozz-${TAG#v}.ipa"
          HAS_IPA=false
          if [ "$RELEASE_EXISTS" = true ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$IPA_NAME"; then
            HAS_IPA=true
          fi

          if [ "$HAS_IPA" = true ] && [ "$FORCE_REBUILD" != true ]; then
            echo "Release $TAG already has $IPA_NAME."
            exit 0
          fi

          if [ "$RELEASE_EXISTS" = true ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$REMOTE_TAG_SHA" != "$HEAD_SHA" ]; then
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
            git tag -d "$TAG" 2>/dev/null || true
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi

          gh workflow run ios-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" || true
